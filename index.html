<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opticenter Clinic & Optică</title>
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Opticenter" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="description" content="Sistem de gestionare a programărilor pentru Opicenter sail." />
    <meta property="og:title" content="Opicenter sail" />
    <meta property="og:description" content="Sistem de gestionare a programărilor pentru Opicenter sail." />
    <script>
      (function () {
        try {
          var host = window.location.hostname || "";
          var isDevPreview =
            host === "localhost" ||
            host === "127.0.0.1" ||
            host.indexOf("ais-dev-") === 0;
          if (!isDevPreview) return;
          var hadController = Boolean(
            "serviceWorker" in navigator && navigator.serviceWorker.controller
          );
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                if (!regs || regs.length === 0) return;
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister();
                  })
                ).then(function () {
                  if (
                    hadController &&
                    !sessionStorage.getItem("__sw_dev_purged")
                  ) {
                    sessionStorage.setItem("__sw_dev_purged", "1");
                    window.location.reload();
                  }
                });
              })
              .catch(function () {});
          }
          if ("caches" in window) {
            caches
              .keys()
              .then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k);
                  })
                );
              })
              .catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
